<script type="module">
		import { WebUtil  } from "@jade-dungeon/jade-utils/web";
		import { GalleryPage } from "@jade-dungeon/site-page/gallery";

		let currPage = 1;
		let currUser = WebUtil.loadCookieValue('data.currUser');
		let urlParams = new URLSearchParams(window.location.search);
		if (currUser && currUser.length > 0) {
			// do nothging
		} else {
			currUser = 'teo';
		}
		let urlUser = urlParams.get('currUser')
		if (urlUser && urlUser.length > 0) {
			currUser = urlUser;
		}		
		let pmPage = urlParams.get('currPage')
		if (pmPage && pmPage.length > 0) {
			currPage = pmPage;
		}

		await GalleryPage.initGalleryPage('@@apiRoot', '温其如玉', currUser, currPage);

</script>
