<!DOCTYPE html>
<html lang="zh-CN">
	<head>
@@include('./src/main/html/parts/meta-charset.html', { })
@@include('./src/main/html/parts/importmap.html', { })
		<title>沙盘 - 场景编辑器</title>
@@include('./src/main/html/parts/favicon.html', { })

@@include('./src/main/html/parts/vendor-98css.html', { })
@@include('./src/main/html/parts/theme-window-ui.html', { })
		<!-- 桌面要占满视口，html/body 两层都得显式设高度 -->
		<style>
html,body {width:99%; height: 99%; overflow: auto;}
		</style>
	</head>
	<body>
<div id="sandbox-desktop" class="desktop dock-content"></div>
	</body>
	<script type="module">
		import { WebUtil } from "@jade-dungeon/jade-utils/web";
		import { initSandboxEditor } from "@jade-dungeon/site-page/sandbox-editor";

		let params = new URLSearchParams(window.location.search);
		let campaignId   = Number(params.get('campaignId'));
		let placeId      = Number(params.get('placeId'   ));
		let sceneId      = Number(params.get('sceneId'   ));
		let campaignName = params.get('campaignName') || '';
		let placeName    = params.get('placeName'   ) || '';
		let sceneName    = params.get('sceneName'   ) || '';

		let username   = WebUtil.loadCookieValue('username'  ) || '';
		let loginToken = WebUtil.loadCookieValue('loginToken') || '';

		// 三个数字 id 都是正整数才算定位有效
		let idsOk = Number.isInteger(campaignId) && Number.isInteger(placeId) && Number.isInteger(sceneId)
			&& campaignId > 0 && placeId > 0 && sceneId > 0;

		// 编辑器要身份（保存时后端靠 loginToken 鉴权），没登录就回登录页
		if (!idsOk) {
			window.location = './index.html';
		} else if (!(username && loginToken)) {
			window.location = './index.html?campaignId=' + encodeURIComponent(campaignId)
				+ '&placeId=' + encodeURIComponent(placeId)
				+ '&sceneId=' + encodeURIComponent(sceneId)
				+ '&campaignName=' + encodeURIComponent(campaignName)
				+ '&placeName=' + encodeURIComponent(placeName)
				+ '&sceneName=' + encodeURIComponent(sceneName);
		} else {
			window.onload = function() {
				initSandboxEditor({
					apiRoot     : '@@apiRoot',
					assetRoot   : '@@staticRoot/themes/trpg/images',
					desktopId   : 'sandbox-desktop',
					iconBaseUrl     : '@@cdn3rd/SE98',
					diceIconBaseUrl : '@@cdn3rd/jade-trpg',
					scene           : { campaignId: campaignId, placeId: placeId, sceneId: sceneId },
					sceneName       : { campaignName: campaignName, placeName: placeName, sceneName: sceneName },
					username    : username,
					loginToken  : loginToken
				}).catch(e => {
					console.error('编辑器启动失败:', e);
					document.getElementById('sandbox-desktop').innerHTML =
						'<p style="padding:1em">编辑器启动失败：' + e.message + '</p>';
				});
			}
		}
	</script>
</html>
